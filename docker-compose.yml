# Sample deployment. The adapter path is the Pulse-Eight CEC adapter as seen on
# htpc (/dev/serial/by-id/usb-Pulse-Eight_CEC_Adapter_v8-if00 -> /dev/ttyACM0).
# /dev/uinput needs the uinput kernel module loaded on the host (modprobe uinput).
# The container runs as root without extra capabilities: both device nodes are
# root-owned, and root owns them.
services:
  cec-rs:
    build: .
    image: cec-rs:latest
    restart: unless-stopped
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
      - /dev/uinput:/dev/uinput
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
